name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the Mathlib build cache
        run: lake exe cache get
      - name: Check every proof (and the axiom audit)
        run: lake build
      - name: Check the generated Rust is up to date
        run: lake env lean --run Emit.lean --check

  lean-imports:
    name: Lean import discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 ci/check_lean_imports.py

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
          # 32-bit userspaces run natively on the 64-bit Linux hosts, in containers.
          - os: ubuntu-latest
            container: linux/386
          - os: ubuntu-24.04-arm
          - os: ubuntu-24.04-arm
            container: linux/arm/v7
          - os: macos-latest
          - os: windows-latest
        rust: [stable, "1.88"]
    runs-on: ${{ matrix.platform.os }}
    env:
      WYCHEPROOF_ROOT: ${{ github.workspace }}/wycheproof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: C2SP/wycheproof
          path: wycheproof
          persist-credentials: false

      - name: Install Rust
        if: ${{ !matrix.platform.container }}
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
          rustup default ${{ matrix.rust }}
      - name: Lint
        if: ${{ !matrix.platform.container && matrix.rust == 'stable' }}
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked
      - name: Test
        if: ${{ !matrix.platform.container }}
        run: cargo test --locked

      - name: Test (in a native ${{ matrix.platform.container }} container)
        if: ${{ matrix.platform.container }}
        run: >-
          docker run --rm --platform ${{ matrix.platform.container }}
          -v "$PWD:/src" -w /src -e RUSTFLAGS -e CARGO_TERM_COLOR
          -e WYCHEPROOF_ROOT=/src/wycheproof
          rust:${{ matrix.rust == 'stable' && '1' || matrix.rust }}-slim
          sh -c 'uname -m && rustc -vV && cargo test --locked'
