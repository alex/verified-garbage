name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# Only pull requests share a group, so a new push to a PR cancels its stale
# run. Runs on main and in the merge queue each get their own group: they're
# never cancelled, and must not queue behind (or replace a pending) earlier run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The Lean build is split into shards that build in parallel, one per
  # target and one for the rest (see ci/lean_shards.py): no target's proofs
  # need another's, and one runner would check them one after another.
  lean-shards:
    name: List the Lean shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "shards=$(python3 ci/lean_shards.py list)" >> "$GITHUB_OUTPUT"

  lean-shard:
    needs: lean-shards
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.lean-shards.outputs.shards) }}
    name: Lean proofs (${{ matrix.shard }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/lean-setup
      # The last build `lean` saved: Lake rebuilds only what changed since.
      - name: Restore this project's build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/lakefile.toml', 'lean/*.lean', 'lean/VerifiedGarbage/**', 'lean/VerifiedGarbageTest/**') }}
          restore-keys: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - name: Check the shard's proofs (and the axiom audit)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          touch "$RUNNER_TEMP/before-build"
          lake build $(python3 ../ci/lean_shards.py targets "$SHARD")
      # What this build wrote for the shard's own modules; Lean's outputs
      # are deterministic, so the shards' outputs agree on the modules they
      # all import.
      - name: Collect the outputs of the shard's modules
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cd .lake/build
          find . -type f -newer "$RUNNER_TEMP/before-build" -printf '%P\n' \
            | python3 ../../../ci/lean_shards.py outputs "$SHARD" \
            | tar --zstd -cf "$RUNNER_TEMP/lean-build-$SHARD.tar.zst" -T -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lean-build-${{ matrix.shard }}
          path: ${{ runner.temp }}/lean-build-${{ matrix.shard }}.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  lean:
    name: Lean proofs
    needs: lean-shard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/lean-setup
      - name: Restore this project's build
        id: lean-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/lakefile.toml', 'lean/*.lean', 'lean/VerifiedGarbage/**', 'lean/VerifiedGarbageTest/**') }}
          restore-keys: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lean-build-*
          merge-multiple: true
          path: ${{ runner.temp }}/lean-build
      - name: Add the shards' outputs to the build
        run: |
          mkdir -p .lake/build
          for f in "$RUNNER_TEMP"/lean-build/*.tar.zst; do
            tar --zstd -xf "$f" -C .lake/build
          done
      # With every shard's outputs this builds nothing; anything it does
      # build (e.g. if a newer cache was restored here than in a shard) is
      # checked here.
      - name: Check every proof (and the axiom audit)
        run: lake build
      # Only main saves. A pull request restores its own branch's caches
      # before main's, so an entry it saved would win over main's newer one
      # after it merges main, and it would re-prove everything main changed
      # since. (Merge queue runs each get their own branch, whose caches no
      # other run can restore.)
      - name: Save this project's build
        if: ${{ steps.lean-build.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: ${{ steps.lean-build.outputs.cache-primary-key }}
      - name: Check the generated Rust is up to date
        run: lake env lean --run Emit.lean --check

  lean-imports:
    name: Lean import discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 ci/check_lean_imports.py
      - run: python3 ci/check_lean_speed.py
      - run: python3 ci/algorithms_table.py --check
      - run: python3 ci/check_arch_gates.py
      - run: python3 ci/check_variants.py

  vectors:
    name: Test vector provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 ci/check_vectors.py

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
          # x86: a 32-bit userspace, run natively on the x86-64 host. There's
          # no pyca runner image for i386, so the job starts by installing the
          # amd64 libc that the runner's (64-bit) Node needs for JS actions
          # (and Python, for the coverage export).
          - os: ubuntu-latest
            container:
              image: rust:slim
              options: --platform linux/386
            install-amd64-libc: true
          - os: ubuntu-24.04-arm
          # ARMv7: a 32-bit userspace, run natively on the ARM64 host.
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/pyca/cryptography-runner-ubuntu-rolling:armv7l
              options: --env RUSTUP_HOME=/root/.rustup
          - os: macos-latest
          - os: windows-latest
        rust: [stable, "1.88"]
        # One job each for the upcoming toolchains, to catch regressions (and
        # new warnings, which are errors here) before they reach stable.
        include:
          - platform:
              os: ubuntu-latest
            rust: beta
          - platform:
              os: ubuntu-latest
            rust: nightly
    runs-on: ${{ matrix.platform.os }}
    # With an empty image the job runs directly on the runner.
    container:
      image: ${{ matrix.platform.container.image || '' }}
      options: ${{ matrix.platform.container.options || '' }}
    env:
      # Selects the toolchain without `rustup default`, which refuses 32-bit
      # toolchains on a 64-bit kernel.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      RUSTFLAGS: -D warnings -Cinstrument-coverage
      # Relative to the crate root, where the test binaries run.
      LLVM_PROFILE_FILE: .rust-cov/cov-%p-%m.profraw
      # Relative to the crate root.
      WYCHEPROOF_ROOT: wycheproof
    steps:
      - name: Install the amd64 libc for the runner's Node
        if: ${{ matrix.platform.install-amd64-libc }}
        run: |
          dpkg --add-architecture amd64
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends libc6:amd64 libstdc++6:amd64 git ca-certificates python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: C2SP/wycheproof
          path: wycheproof
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt,llvm-tools
      # The dependencies (built with opt-level 3) are most of the build.
      # Only main saves, so pull requests restore main's entries instead of
      # filling the cache quota with their own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Share with rust-sde when the toolchain and build environment match.
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint
        if: ${{ matrix.rust == 'stable' }}
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked
          cargo clippy --all-targets --locked --features cpu-features-env
      - run: rustc -vV
      - run: cargo test --locked
      - name: Export coverage
        shell: bash
        run: $(command -v python3 || command -v python) ci/export_rust_coverage.py .rust-cov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ strategy.job-index }}
          path: "*.lcov"
          if-no-files-found: error

  # CPU feature detection, and the primitives that choose among
  # implementations by CPU feature (see src/cpu.rs), tested end to end in
  # each configuration that chooses differently, set with `VG_CPU_FEATURES`:
  # every feature beyond x86-64's baseline (the SHA extensions, AES-NI,
  # PCLMULQDQ, SSSE3, AVX, AVX2, BMI1 and BMI2), natively where this runner
  # has them and otherwise under Intel SDE, emulating a CPU that has every
  # one; AVX, AVX2, BMI1 and BMI2 alone (SHA-256 without the SHA extensions);
  # and none, the baseline ISA's implementations. Detection is also tested under SDE on a
  # Pentium 4, which no runner is: it has neither feature, nor CPUID leaf 7.
  # The coverage is merged with the rest.
  rust-cpu-features:
    strategy:
      fail-fast: false
      matrix:
        # Empty: every feature the CPU has.
        cpu-features: ["", "avx,avx2,bmi1,bmi2", none]
    name: Rust (VG_CPU_FEATURES=${{ matrix.cpu-features || 'unset' }})
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTFLAGS: -D warnings -Cinstrument-coverage
      LLVM_PROFILE_FILE: .rust-cov/cov-%p-%m.profraw
      WYCHEPROOF_ROOT: wycheproof
      VG_CPU_FEATURES: ${{ matrix.cpu-features }}
      SDE_VERSION: 10.13.1-2026-07-28
      SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
      SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: C2SP/wycheproof
          path: wycheproof
          persist-credentials: false
      - name: Download Intel SDE
        if: ${{ matrix.cpu-features != 'none' }}
        run: |
          curl -sSfLo sde.tar.xz "$SDE_URL"
          echo "$SDE_SHA256  sde.tar.xz" | sha256sum -c
          mkdir "$RUNNER_TEMP/sde"
          tar -xJf sde.tar.xz -C "$RUNNER_TEMP/sde" --strip-components 1
          rm sde.tar.xz
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Set the test runner after caching: its temporary path would otherwise
      # change the cache key, which includes CARGO_* environment variables.
      - name: Choose where to run the tests of the implementations
        if: ${{ matrix.cpu-features != 'none' }}
        run: |
          missing=
          for f in sha_ni aes pclmulqdq ssse3 avx avx2 bmi1 bmi2; do
            grep -qw "$f" /proc/cpuinfo || missing="$missing $f"
          done
          echo "This runner lacks:${missing:- nothing}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$missing" ]; then
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$RUNNER_TEMP/sde/sde64 -future --" >> "$GITHUB_ENV"
          fi
      # Only the tests of what depends on CPU features.
      - name: Test the implementations
        run: cargo test --locked --features cpu-features-env -- sha1 sha256 aes_gcm chacha20 cpu
      - name: Test detection on a Pentium 4 (under SDE)
        if: ${{ matrix.cpu-features == '' }}
        run: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$RUNNER_TEMP/sde/sde64 -p4p --" cargo test --locked --features cpu-features-env --lib -- cpu
      - name: Export coverage
        run: python3 ci/export_rust_coverage.py .rust-cov --features cpu-features-env
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-cpu-features-${{ strategy.job-index }}
          path: "*.lcov"
          if-no-files-found: error

  coverage:
    needs: [rust, rust-cpu-features]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r ci/requirements-coverage.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data/
      - name: Combine coverage and fail if it's <100%
        id: combinecoverage
        run: |
          set +e
          echo "## Coverage" >> $GITHUB_STEP_SUMMARY
          .venv/bin/python -u ci/merge_rust_coverage.py coverage-data/ | tee COV_REPORT
          COV_EXIT_CODE=${PIPESTATUS[0]}
          if [ $COV_EXIT_CODE -ne 0 ]; then
            echo "🚨 Coverage failed. Under 100" | tee -a $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat COV_REPORT >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $COV_EXIT_CODE
      - name: Upload HTML report
        if: ${{ failure() && steps.combinecoverage.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: _html-coverage-report
          path: htmlcov
          if-no-files-found: ignore

  # The one check to require in branch protection (and so for the merge queue),
  # so the required checks don't have to track every job and matrix entry.
  all-green:
    if: ${{ always() }}
    needs: [lean, lean-imports, vectors, rust, rust-cpu-features, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
