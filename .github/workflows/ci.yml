name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# Only pull requests share a group, so a new push to a PR cancels its stale
# run. Runs on main and in the merge queue each get their own group: they're
# never cancelled, and must not queue behind (or replace a pending) earlier run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The Lean build is split into shards that build in parallel (see
  # ci/lean_shards.py).
  lean-plan:
    name: Plan the Lean build
    runs-on: ubuntu-latest
    # To find the merge queue's run of this commit.
    permissions:
      actions: read
      contents: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      build-key: ${{ steps.plan.outputs.build-key }}
      reuse: ${{ steps.reuse.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub moves main to exactly the commit its merge queue tested, with
      # this workflow, restoring only main's caches (and its own new
      # branch's, which start empty): that run's Lean outputs are what a push
      # to main would build. So the push reuses them (see `lean`) instead of
      # running the shards, if that run succeeded and they're still there.
      # Never a pull request's run: only the merge queue's branches for main.
      - id: reuse
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          id=$(gh run list --workflow ci.yml --event merge_group --commit "$GITHUB_SHA" --status success \
            --json databaseId,headBranch \
            --jq '[.[] | select(.headBranch | startswith("gh-readonly-queue/main/"))][0].databaseId // empty' || true)
          if [ -n "$id" ] && [ "$(gh api "repos/$GH_REPO/actions/runs/$id/artifacts?name=lean-build-final" \
              --jq '.artifacts[0].expired' || true)" = false ]; then
            echo "Reusing the Lean outputs of run $id."
            echo "run-id=$id" >> "$GITHUB_OUTPUT"
          fi
      # The hashes of the sources of `main`'s last build, and how long each
      # module took to build.
      - name: Restore the manifest of the last build
        id: manifest
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lean-manifest
          key: lean-manifest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/lakefile.toml', 'lean/*.lean', 'lean/VerifiedGarbage/**', 'lean/VerifiedGarbageTest/**') }}
          restore-keys: lean-manifest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - id: plan
        env:
          MATCHED: ${{ steps.manifest.outputs.cache-matched-key }}
        run: |
          python3 ci/lean_shards.py plan .lean-manifest/manifest.json "$RUNNER_TEMP/lean-plan.json" >> "$GITHUB_OUTPUT"
          # The build saved with the manifest, which the plan is for.
          if [ -n "$MATCHED" ]; then
            echo "build-key=lean-build-${MATCHED#lean-manifest-}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lean-plan
          path: ${{ runner.temp }}/lean-plan.json
          retention-days: 1
          if-no-files-found: error

  lean-shard:
    # More independent files, with two compiler threads per file (lakefile.toml).
    env:
      LEAN_NUM_THREADS: "6"
    needs: lean-plan
    if: ${{ needs.lean-plan.outputs.count != '0' && needs.lean-plan.outputs.reuse == '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.lean-plan.outputs.shards) }}
    # No expressions: GitHub does not evaluate them in the name of a skipped
    # job, and shows them as written. It adds the shard to each running
    # job's name itself ("Lean proof shard (3)").
    name: Lean proof shard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build the plan is for (or, if it has none, the last build `lean`
      # saved): Lake rebuilds only what changed since. Mostly extraction,
      # into `.lake/build`, which nothing in `lean-setup` touches: it runs
      # in the background while `lean-setup` installs Lean and Mathlib.
      - name: Restore this project's build
        id: lean-build
        background: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/lakefile.toml', 'lean/*.lean', 'lean/VerifiedGarbage/**', 'lean/VerifiedGarbageTest/**') }}
          restore-keys: |
            ${{ needs.lean-plan.outputs.build-key }}
            lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - uses: ./.github/actions/lean-setup
      - wait: [lean-build]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lean-plan
          path: ${{ runner.temp }}
      - name: Check the shard's proofs (and the axiom audit)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          touch "$RUNNER_TEMP/before-build"
          lake build $(python3 ../ci/lean_shards.py targets "$RUNNER_TEMP/lean-plan.json" "$SHARD") 2>&1 \
            | tee "$RUNNER_TEMP/build.log"
      # What this build wrote for the shard's own modules; Lean's outputs
      # are deterministic, so the shards' outputs agree on the modules they
      # all import. And how long it took to build each module, for later
      # plans.
      - name: Collect the outputs of the shard's modules
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 ../ci/lean_shards.py times < "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/lean-times-$SHARD.json"
          cd .lake/build
          find . -type f -newer "$RUNNER_TEMP/before-build" -printf '%P\n' \
            | python3 ../../../ci/lean_shards.py outputs "$RUNNER_TEMP/lean-plan.json" "$SHARD" \
            | tar --zstd -cf "$RUNNER_TEMP/lean-build-$SHARD.tar.zst" -T -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lean-build-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/lean-build-${{ matrix.shard }}.tar.zst
            ${{ runner.temp }}/lean-times-${{ matrix.shard }}.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  lean:
    env:
      LEAN_NUM_THREADS: "6"
    name: Lean proofs
    needs: [lean-plan, lean-shard]
    # Also when the plan has no shards, or reuses the merge queue's outputs,
    # which skip `lean-shard`.
    if: ${{ !cancelled() && needs.lean-plan.result == 'success' && (needs.lean-shard.result == 'success' || needs.lean-shard.result == 'skipped') }}
    runs-on: ubuntu-latest
    # To download the merge queue run's outputs.
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both restores run in the background while `lean-setup` installs Lean
      # and Mathlib: they write `.lake/build` and `.lean-manifest`, which it
      # does not touch.
      - name: Restore this project's build
        id: lean-build
        background: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/lakefile.toml', 'lean/*.lean', 'lean/VerifiedGarbage/**', 'lean/VerifiedGarbageTest/**') }}
          restore-keys: |
            ${{ needs.lean-plan.outputs.build-key }}
            lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - name: Restore the manifest of the last build
        id: lean-manifest
        background: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lean-manifest
          key: lean-manifest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/lakefile.toml', 'lean/*.lean', 'lean/VerifiedGarbage/**', 'lean/VerifiedGarbageTest/**') }}
          restore-keys: lean-manifest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - uses: ./.github/actions/lean-setup
      - wait: [lean-build, lean-manifest]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.lean-shard.result == 'success' }}
        with:
          pattern: lean-build-*
          merge-multiple: true
          path: ${{ runner.temp }}/lean-build
      # On a push to main, the merge queue run's outputs of this commit (see
      # `lean-plan`): its shards' and its own (`lean-build-final`, extracted
      # last). Lake rebuilds whatever doesn't match the sources.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.lean-plan.outputs.reuse != '' }}
        with:
          pattern: lean-build-*
          merge-multiple: true
          path: ${{ runner.temp }}/lean-build
          run-id: ${{ needs.lean-plan.outputs.reuse }}
          github-token: ${{ github.token }}
      - name: Add the shards' outputs to the build
        run: |
          mkdir -p .lake/build
          for f in "$RUNNER_TEMP"/lean-build/*.tar.zst; do
            [ -e "$f" ] || continue
            tar --zstd -xf "$f" -C .lake/build
          done
      # With every shard's outputs this builds only what the plan left to
      # this job (all of it, with no shards); anything else it builds (e.g.
      # if a newer cache was restored here than in a shard) is checked here.
      - name: Check every proof (and the axiom audit)
        run: |
          set -o pipefail
          touch "$RUNNER_TEMP/before-build"
          lake build 2>&1 | tee "$RUNNER_TEMP/build.log"
      # In the merge queue, what this job built, for the push to main to reuse.
      - name: Collect the outputs of this build
        if: ${{ github.event_name == 'merge_group' }}
        run: |
          python3 ../ci/lean_shards.py times < "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/lean-times-final.json"
          cd .lake/build
          find . -type f -newer "$RUNNER_TEMP/before-build" -printf '%P\n' \
            | tar --zstd -cf "$RUNNER_TEMP/lean-build-final.tar.zst" -T -
      - if: ${{ github.event_name == 'merge_group' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lean-build-final
          path: |
            ${{ runner.temp }}/lean-build-final.tar.zst
            ${{ runner.temp }}/lean-times-final.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      # Only main saves. A pull request restores its own branch's caches
      # before main's, so an entry it saved would win over main's newer one
      # after it merges main, and it would re-prove everything main changed
      # since. (Merge queue runs each get their own branch, whose caches no
      # other run can restore.)
      - name: Write the manifest of this build
        id: manifest
        if: ${{ steps.lean-build.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        env:
          KEY: ${{ steps.lean-build.outputs.cache-primary-key }}
        run: |
          python3 ../ci/lean_shards.py times < "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/lean-times.json"
          python3 ../ci/lean_shards.py manifest ../.lean-manifest/manifest.json \
            "$RUNNER_TEMP"/lean-build/lean-times-*.json "$RUNNER_TEMP/lean-times.json" > "$RUNNER_TEMP/manifest.json"
          mkdir -p ../.lean-manifest
          mv "$RUNNER_TEMP/manifest.json" ../.lean-manifest/manifest.json
          echo "key=lean-manifest-${KEY#lean-build-}" >> "$GITHUB_OUTPUT"
      # Lake never deletes the outputs of a module that was deleted or
      # renamed, and each build starts from the last one saved: without
      # this, they would be saved again until the toolchain changes.
      - name: Remove the outputs of modules that no longer exist
        if: ${{ steps.manifest.outcome == 'success' }}
        run: python3 ../ci/lean_shards.py prune .lake/build
      - name: Save this project's build
        if: ${{ steps.manifest.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: ${{ steps.lean-build.outputs.cache-primary-key }}
      # After the build, so that a plan never finds a manifest without its
      # build.
      - name: Save the manifest of this build
        if: ${{ steps.manifest.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lean-manifest
          key: ${{ steps.manifest.outputs.key }}
      - name: Check the generated Rust is up to date
        run: lake env lean --run Emit.lean --check

  lean-imports:
    name: Lean import discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 ci/check_lean_imports.py
      - run: python3 ci/check_lean_speed.py
      - run: python3 ci/algorithms_table.py --check
      - run: python3 ci/check_arch_gates.py
      - run: python3 ci/check_variants.py
      - run: python3 -m unittest discover -s ci -p 'test_check_*.py'
      - run: python3 ci/check_mcdt.py

  vectors:
    name: Test vector provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 ci/check_vectors.py

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
          # x86: a 32-bit userspace, run natively on the x86-64 host. There's
          # no pyca runner image for i386, so the job starts by installing the
          # amd64 libc that the runner's (64-bit) Node needs for JS actions
          # (and Python, for the coverage export).
          - os: ubuntu-latest
            container:
              image: rust:slim
              options: --platform linux/386
            install-amd64-libc: true
          - os: ubuntu-24.04-arm
          # ARMv7: a 32-bit userspace, run natively on the ARM64 host.
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/pyca/cryptography-runner-ubuntu-rolling:armv7l
              # A fresh home avoids upgrading the image's incomplete Rust installation.
              options: --env RUSTUP_HOME=/tmp/verified-garbage-rustup
          - os: macos-latest
          - os: windows-latest
        rust: [stable]
        include:
          # The minimum supported Rust version (Cargo.toml's `rust-version`),
          # on one platform.
          - platform:
              os: ubuntu-latest
            rust: "1.88"
          # One job each for the upcoming toolchains, to catch regressions (and
          # new warnings, which are errors here) before they reach stable.
          - platform:
              os: ubuntu-latest
            rust: beta
          - platform:
              os: ubuntu-latest
            rust: nightly
    runs-on: ${{ matrix.platform.os }}
    # With an empty image the job runs directly on the runner.
    container:
      image: ${{ matrix.platform.container.image || '' }}
      options: ${{ matrix.platform.container.options || '' }}
    env:
      # Selects the toolchain without `rustup default`, which refuses 32-bit
      # toolchains on a 64-bit kernel.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      RUSTFLAGS: -D warnings -Cinstrument-coverage
      # Both relative to the crate root, where the test binaries run.
      LLVM_PROFILE_FILE: .rust-cov/cov-%p-%m.profraw
      WYCHEPROOF_ROOT: wycheproof
    steps:
      - name: Install the amd64 libc for the runner's Node
        if: ${{ matrix.platform.install-amd64-libc }}
        run: |
          dpkg --add-architecture amd64
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends libc6:amd64 libstdc++6:amd64 git ca-certificates python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: C2SP/wycheproof
          path: wycheproof
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt,llvm-tools
      # The dependencies (built with opt-level 3) are most of the build.
      # Only main saves, so pull requests restore main's entries instead of
      # filling the cache quota with their own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Share with rust-sde when the toolchain and build environment match.
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint
        if: ${{ matrix.rust == 'stable' }}
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked
          cargo clippy --all-targets --locked --features cpu-features-env
      - run: rustc -vV
      - run: cargo test --locked
      - name: Test baseline x86 implementations
        if: ${{ matrix.platform.install-amd64-libc }}
        env:
          VG_CPU_FEATURES: none
        run: cargo test --locked --features cpu-features-env
      - name: Export coverage
        shell: bash
        run: $(command -v python3 || command -v python) ci/export_rust_coverage.py .rust-cov
      - name: Export baseline x86 coverage
        if: ${{ matrix.platform.install-amd64-libc }}
        run: python3 ci/export_rust_coverage.py .rust-cov --features cpu-features-env
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ strategy.job-index }}
          path: "*.lcov"
          if-no-files-found: error

  # The ARM code in Thumb (T32): the `rust` job's ARMv7 target assembles it
  # as A32, while thumbv7neon-*, Android, Windows and M-profile targets
  # assemble the same text as T32 (see "Modelling choices" in
  # lean/VerifiedGarbage/TCB/Arm/Isa.lean). Run natively, like ARMv7, on the
  # ARM64 host. Without coverage: the standard library of this target has
  # no profiler runtime, and its Rust code is the ARMv7 job's, which is
  # covered there.
  rust-thumb:
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported Rust version is tested in the `rust` job.
        rust: [stable]
    name: Rust (Thumb, ${{ matrix.rust }})
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/pyca/cryptography-runner-ubuntu-rolling:armv7l
      # A fresh home avoids upgrading the image's incomplete Rust installation.
      options: --env RUSTUP_HOME=/tmp/verified-garbage-rustup
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      # For every cargo command, with the container's native linker.
      CARGO_BUILD_TARGET: thumbv7neon-unknown-linux-gnueabihf
      RUSTFLAGS: -D warnings
      WYCHEPROOF_ROOT: wycheproof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: C2SP/wycheproof
          path: wycheproof
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy --target thumbv7neon-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-thumb
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: rustc -vV
      - name: Lint
        if: ${{ matrix.rust == 'stable' }}
        run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      # That the tests ran T32: the symbol of Thumb code has an odd address
      # (AAELF32 §5.5.3, "Symbol Values").
      - name: Check the verified functions are Thumb code
        run: |
          find "target/$CARGO_BUILD_TARGET/debug/deps" -maxdepth 1 -type f -executable -exec readelf -sW {} + |
            awk '$4 == "FUNC" && $8 ~ /vg_/ { n++; if ($2 ~ /[02468aceACE]$/) { print "not Thumb: " $8; bad++ } }
                 END { print n " verified function symbols"; exit (n == 0 || bad > 0) }'

  # CPU feature detection (src/cpu.rs) and the primitives that choose an
  # implementation by CPU feature, tested end to end on this runner's CPU,
  # on CPUs that Intel SDE emulates, and natively on ARM64 (where
  # `cpu-features-env` detects features at run time; without it, AArch64
  # detection is at compile time, which the `rust` job tests). SDE runs the
  # SHA extensions' code tens of times slower than hardware (#274), so the
  # chips that have them (arl, icx, dmr) run only the tests they are there
  # for. `cpu-features` restricts a chip's features with `VG_CPU_FEATURES`
  # (empty for none), so that each implementation, and each of Ed25519's
  # combinations of SHA-512 and field multiplication, is chosen somewhere;
  # the coverage, merged with the rest, checks that every one was.
  rust-cpu-features:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        # skx: AVX-512F, BMI2 and ADX; hsw: AVX2, but not AVX-512F or ADX;
        # p4p: nothing beyond x86-64's baseline, not even CPUID leaf 7.
        chip: [native, skx, hsw, p4p]
        # Ed25519's are `ed25519` and RFC 8032's other two.
        tests: [sha1 sha224 sha256 sha384 sha512 aes_gcm cmac chacha20 triple_des_ecb poly1305 mlkem mldsa scrypt x25519 x448 ed25519 message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu]
        include:
          # x86 feature dispatch, natively in a 32-bit userspace, with both
          # the runner's features and the baseline implementations.
          - chip: native
            arch: x86
            container:
              image: rust:slim
              options: --platform linux/386
            install-amd64-libc: true
            tests: sha1 sha224 sha256 sha384 sha512 aes_gcm cmac chacha20 mlkem scrypt x25519 ed25519 cpu
          - chip: native
            arch: x86
            cpu-features: none
            container:
              image: rust:slim
              options: --platform linux/386
            install-amd64-libc: true
            tests: sha1 sha224 sha256 sha384 sha512 aes_gcm cmac chacha20 mlkem scrypt x25519 ed25519 cpu
          # Arrow Lake: the SHA512 extension, which no runner has.
          - chip: arl
            tests: sha384 sha512 ed25519 message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
          - chip: arl
            cpu-features: avx,avx2,sha512
            tests: ed25519 message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
          - chip: skx
            cpu-features: bmi2,adx
            tests: ed25519 message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
          # Ice Lake server: AVX512_IFMA and AVX512VL, for vg_x25519_ifma
          # and Ed25519's IFMA variants.
          - chip: icx
            tests: x25519 ed25519 message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
          - chip: icx
            cpu-features: avx,avx2,bmi2,adx,avx512ifma,avx512vl
            tests: ed25519 message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
          # Diamond Rapids: the SHA512 extension and AVX512_IFMA, for
          # Ed25519's verification with both (vg_ed25519_verify_shani_ifma).
          - chip: dmr
            tests: ed25519 message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
          - chip: native
            arch: aarch64
            os: ubuntu-24.04-arm
            tests: aes_gcm cmac sha1 sha224 sha256 sha384 sha512 sha3 shake mlkem mldsa scrypt chacha20 ed25519 message_boundaries_and_unaligned_inputs signing_with_aliased_read_only_inputs cpu
          # AES-GCM's instances for AES's or GHASH's extension alone, which no
          # runner or chip has without the other, on x86-64 and on x86; and,
          # on x86-64, AES-NI's and PCLMULQDQ's together (and AES-CMAC's
          # AES-NI functions), which a runner with VAES and VPCLMULQDQ never
          # chooses.
          - chip: native
            cpu-features: aes,ssse3
            tests: aes_gcm cmac cpu
          - chip: native
            cpu-features: pclmulqdq,ssse3
            tests: aes_gcm cpu
          - chip: native
            cpu-features: aes,pclmulqdq,ssse3
            tests: aes_gcm cpu
          # Ice Lake server: VAES and VPCLMULQDQ, for vg_aes_ctr32_vaes,
          # vg_ghash_vpclmul and the AES-GCM and AES-CMAC instances calling
          # them; and AES-GCM's with each alone or paired with the other's
          # 128-bit instruction, which no chip has without the other.
          - chip: icx
            tests: aes_gcm cmac cpu
          - chip: icx
            cpu-features: aes,avx,avx2,ssse3,vaes
            tests: aes_gcm cpu
          - chip: icx
            cpu-features: avx,avx2,pclmulqdq,ssse3,vpclmulqdq
            tests: aes_gcm cpu
          - chip: icx
            cpu-features: aes,avx,avx2,pclmulqdq,ssse3,vaes
            tests: aes_gcm cpu
          - chip: icx
            cpu-features: aes,avx,avx2,pclmulqdq,ssse3,vpclmulqdq
            tests: aes_gcm cpu
          - chip: native
            arch: x86
            cpu-features: aes
            container:
              image: rust:slim
              options: --platform linux/386
            install-amd64-libc: true
            tests: aes_gcm cpu
          - chip: native
            arch: x86
            cpu-features: pclmulqdq,ssse3
            container:
              image: rust:slim
              options: --platform linux/386
            install-amd64-libc: true
            tests: aes_gcm cpu
    name: Rust (${{ matrix.os && format('native, {0}', matrix.os) || matrix.chip == 'native' && 'native' || format('sde -{0}', matrix.chip) }}${{ matrix.arch && format(', {0}', matrix.arch) || '' }}${{ matrix.cpu-features && format(', VG_CPU_FEATURES={0}', matrix.cpu-features) || '' }})
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    container:
      image: ${{ matrix.container.image || '' }}
      options: ${{ matrix.container.options || '' }}
    env:
      RUSTUP_TOOLCHAIN: stable
      VG_CPU_FEATURES: ${{ matrix.cpu-features || '' }}
      RUSTFLAGS: -D warnings -Cinstrument-coverage
      LLVM_PROFILE_FILE: .rust-cov/cov-%p-%m.profraw
      WYCHEPROOF_ROOT: wycheproof
      SDE_VERSION: 10.13.1-2026-07-28
      SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
      SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
    steps:
      - name: Install the amd64 libc for the runner's Node
        if: ${{ matrix.install-amd64-libc }}
        run: |
          dpkg --add-architecture amd64
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends libc6:amd64 libstdc++6:amd64 git ca-certificates python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: C2SP/wycheproof
          path: wycheproof
          persist-credentials: false
      - name: This runner's CPU
        run: |
          if [ "$(uname -m)" = aarch64 ]; then
            grep -m1 Features /proc/cpuinfo | tr ' ' '\n' | grep -xE 'aes|pmull|sve2' | tr '\n' ' '
          else
            grep -m1 'model name' /proc/cpuinfo
            grep -m1 flags /proc/cpuinfo | tr ' ' '\n' \
              | grep -xE 'ssse3|sha_ni|aes|pclmulqdq|avx|avx2|bmi1|bmi2|avx512f|sha512|adx|avx512ifma|avx512vl|vaes|vpclmulqdq' \
              | tr '\n' ' '
          fi
      - name: Download Intel SDE
        if: ${{ matrix.chip != 'native' }}
        run: |
          curl -sSfLo sde.tar.xz "$SDE_URL"
          echo "$SDE_SHA256  sde.tar.xz" | sha256sum -c
          mkdir "$RUNNER_TEMP/sde"
          tar -xJf sde.tar.xz -C "$RUNNER_TEMP/sde" --strip-components 1
          rm sde.tar.xz
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Set the test runner after caching: its temporary path would otherwise
      # change the cache key, which includes CARGO_* environment variables.
      - name: Run the tests under SDE
        if: ${{ matrix.chip != 'native' }}
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$RUNNER_TEMP/sde/sde64 -$CHIP --" >> "$GITHUB_ENV"
        env:
          CHIP: ${{ matrix.chip }}
      # Only the tests of what depends on CPU features.
      - name: Test the implementations
        run: cargo test --locked --features cpu-features-env -- $TESTS
        env:
          TESTS: ${{ matrix.tests }}
      - name: Test scalar ChaCha on ARM64
        if: ${{ matrix.os == 'ubuntu-24.04-arm' }}
        run: cargo test --locked --features cpu-features-env -- chacha20
        env:
          VG_CPU_FEATURES: none
      # The runner has SVE2, so the native run tests the `_sve2` instances.
      - name: Test NEON ChaCha on ARM64
        if: ${{ matrix.os == 'ubuntu-24.04-arm' }}
        run: cargo test --locked --features cpu-features-env -- chacha20
        env:
          VG_CPU_FEATURES: neon
      - name: Test the ARM64 SHA-3 prototype and scalar fallback
        if: ${{ matrix.os == 'ubuntu-24.04-arm' }}
        run: |
          VG_CPU_FEATURES=sha3 cargo test --locked --features cpu-features-env -- sha3 shake mlkem mldsa
          VG_CPU_FEATURES=none cargo test --locked --features cpu-features-env -- sha3 shake mlkem mldsa
      - name: Export coverage
        run: python3 ci/export_rust_coverage.py .rust-cov --features cpu-features-env
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-cpu-features-${{ strategy.job-index }}
          path: "*.lcov"
          if-no-files-found: error

  coverage:
    needs: [rust, rust-cpu-features]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r ci/requirements-coverage.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data/
      - name: Combine coverage and fail if it's <100%
        id: combinecoverage
        run: |
          set +e
          echo "## Coverage" >> $GITHUB_STEP_SUMMARY
          .venv/bin/python -u ci/merge_rust_coverage.py coverage-data/ | tee COV_REPORT
          COV_EXIT_CODE=${PIPESTATUS[0]}
          if [ $COV_EXIT_CODE -ne 0 ]; then
            echo "🚨 Coverage failed. Under 100" | tee -a $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat COV_REPORT >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $COV_EXIT_CODE
      - name: Upload HTML report
        if: ${{ failure() && steps.combinecoverage.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: _html-coverage-report
          path: htmlcov
          if-no-files-found: ignore

  # The one check to require in branch protection (and so for the merge queue),
  # so the required checks don't have to track every job and matrix entry.
  all-green:
    if: ${{ always() }}
    needs: [lean, lean-imports, vectors, rust, rust-thumb, rust-cpu-features, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
