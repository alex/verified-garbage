name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# Only pull requests share a group, so a new push to a PR cancels its stale
# run. Runs on main and in the merge queue each get their own group: they're
# never cancelled, and must not queue behind (or replace a pending) earlier run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: List the modules the proofs import from outside the project
        id: mods
        run: |
          # Every module the Lean files import from outside this project and
          # Lean itself, as Lean's own parser reads their headers.
          mods=$(git ls-files '*.lean' | xargs lean --deps-json \
            | jq -r '.imports[].result.imports[].module
                     | select(test("^(VerifiedGarbage[A-Za-z]*|Init|Std|Lean)(\\.|$)") | not)' \
            | sort -u)
          echo "$mods"
          echo "mods=$(echo $mods)" >> "$GITHUB_OUTPUT"
          echo "hash=$(echo "$mods" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # Mathlib and its dependencies, with the prebuilt files for those
      # modules: they change only with the toolchain, the manifest or the
      # list, so a hit skips the clones, building Mathlib's `cache` tool and
      # the download.
      - name: Restore Mathlib and its dependencies
        id: lake-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ steps.mods.outputs.hash }}
      # Lake would clone mathlib4's whole history; a checkout of the pinned
      # revision is all the build needs, and Lake accepts it as is.
      - name: Shallow-clone Mathlib
        if: ${{ steps.lake-packages.outputs.cache-hit != 'true' }}
        run: |
          rev=$(jq -r '.packages[] | select(.name == "mathlib") | .rev' lake-manifest.json)
          git init -q .lake/packages/mathlib
          cd .lake/packages/mathlib
          git remote add origin https://github.com/leanprover-community/mathlib4
          git fetch -q --depth 1 origin "$rev"
          git checkout -q FETCH_HEAD
      # `cache get` fetches these modules and what they import, not all of
      # Mathlib.
      - name: Fetch the Mathlib build cache for what the proofs import
        if: ${{ steps.lake-packages.outputs.cache-hit != 'true' }}
        env:
          MODS: ${{ steps.mods.outputs.mods }}
        run: lake exe cache get $MODS
      # Fail, rather than quietly build part of Mathlib from source, if the
      # cache left any of them (or what they import) unbuilt.
      - name: Check Mathlib is built for every import
        env:
          MODS: ${{ steps.mods.outputs.mods }}
        run: lake build --no-build $MODS
      - name: Save Mathlib and its dependencies
        if: ${{ steps.lake-packages.outputs.cache-hit != 'true' && github.event_name != 'merge_group' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/packages
          key: ${{ steps.lake-packages.outputs.cache-primary-key }}
      - name: Restore this project's build
        id: lean-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/lakefile.toml', 'lean/*.lean', 'lean/VerifiedGarbage/**', 'lean/VerifiedGarbageTest/**') }}
          restore-keys: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - name: Check every proof (and the axiom audit)
        run: lake build
      # Merge queue runs each get their own branch, whose caches no other run
      # can restore.
      - name: Save this project's build
        if: ${{ steps.lean-build.outputs.cache-hit != 'true' && github.event_name != 'merge_group' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake/build
          key: ${{ steps.lean-build.outputs.cache-primary-key }}
      - name: Check the generated Rust is up to date
        run: lake env lean --run Emit.lean --check

  lean-imports:
    name: Lean import discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 ci/check_lean_imports.py
      - run: python3 ci/check_lean_speed.py
      - run: python3 ci/algorithms_table.py --check

  vectors:
    name: Test vector provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 ci/check_vectors.py

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
          # x86: a 32-bit userspace, run natively on the x86-64 host. There's
          # no pyca runner image for i386, so the job starts by installing the
          # amd64 libc that the runner's (64-bit) Node needs for JS actions
          # (and Python, for the coverage export).
          - os: ubuntu-latest
            container:
              image: rust:slim
              options: --platform linux/386
            install-amd64-libc: true
          - os: ubuntu-24.04-arm
          # ARMv7: a 32-bit userspace, run natively on the ARM64 host.
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/pyca/cryptography-runner-ubuntu-rolling:armv7l
              options: --env RUSTUP_HOME=/root/.rustup
          - os: macos-latest
          - os: windows-latest
        rust: [stable, "1.88"]
        # One job each for the upcoming toolchains, to catch regressions (and
        # new warnings, which are errors here) before they reach stable.
        include:
          - platform:
              os: ubuntu-latest
            rust: beta
          - platform:
              os: ubuntu-latest
            rust: nightly
    runs-on: ${{ matrix.platform.os }}
    # With an empty image the job runs directly on the runner.
    container:
      image: ${{ matrix.platform.container.image || '' }}
      options: ${{ matrix.platform.container.options || '' }}
    env:
      # Selects the toolchain without `rustup default`, which refuses 32-bit
      # toolchains on a 64-bit kernel.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      RUSTFLAGS: -D warnings -Cinstrument-coverage
      # Relative to the crate root, where the test binaries run.
      LLVM_PROFILE_FILE: .rust-cov/cov-%p-%m.profraw
      # Relative to the crate root.
      WYCHEPROOF_ROOT: wycheproof
    steps:
      - name: Install the amd64 libc for the runner's Node
        if: ${{ matrix.platform.install-amd64-libc }}
        run: |
          dpkg --add-architecture amd64
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends libc6:amd64 libstdc++6:amd64 git ca-certificates python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: C2SP/wycheproof
          path: wycheproof
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt,llvm-tools
      # The dependencies (built with opt-level 3) are most of the build.
      # Only main saves, so pull requests restore main's entries instead of
      # filling the cache quota with their own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint
        if: ${{ matrix.rust == 'stable' }}
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked
      - run: rustc -vV
      - run: cargo test --locked
      - name: Export coverage
        shell: bash
        run: $(command -v python3 || command -v python) ci/export_rust_coverage.py .rust-cov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ strategy.job-index }}
          path: "*.lcov"
          if-no-files-found: error

  # CPU feature detection, and the implementations that need CPU features
  # beyond x86-64's baseline (the SHA extensions, AES-NI, PCLMULQDQ and
  # SSSE3), which the `rust`
  # jobs' runners may lack. Their tests run natively where this runner has
  # the features, and otherwise under Intel SDE, emulating a CPU that has
  # every feature. Detection is also tested under SDE on a Pentium 4, which
  # no runner is: it has neither feature, nor CPUID leaf 7. The coverage is
  # merged with the rest.
  rust-sde:
    name: Rust (CPU features, natively and under Intel SDE)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -Cinstrument-coverage
      LLVM_PROFILE_FILE: .rust-cov/cov-%p-%m.profraw
      WYCHEPROOF_ROOT: wycheproof
      SDE_VERSION: 10.13.1-2026-07-28
      SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
      SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: C2SP/wycheproof
          path: wycheproof
          persist-credentials: false
      - name: Download Intel SDE
        run: |
          curl -sSfLo sde.tar.xz "$SDE_URL"
          echo "$SDE_SHA256  sde.tar.xz" | sha256sum -c
          mkdir "$RUNNER_TEMP/sde"
          tar -xJf sde.tar.xz -C "$RUNNER_TEMP/sde" --strip-components 1
          rm sde.tar.xz
      - name: Choose where to run the tests of the implementations
        run: |
          missing=
          for f in sha_ni aes pclmulqdq ssse3; do
            grep -qw "$f" /proc/cpuinfo || missing="$missing $f"
          done
          echo "This runner lacks:${missing:- nothing}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$missing" ]; then
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$RUNNER_TEMP/sde/sde64 -future --" >> "$GITHUB_ENV"
          fi
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Only the tests of what depends on CPU features.
      - name: Test the implementations (under SDE if this runner lacks features)
        run: cargo test --locked -- sha256 aes_gcm cpu
      - name: Test detection on a Pentium 4 (under SDE)
        run: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="$RUNNER_TEMP/sde/sde64 -p4p --" cargo test --locked --lib -- cpu
      - name: Export coverage
        run: python3 ci/export_rust_coverage.py .rust-cov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-sde
          path: "*.lcov"
          if-no-files-found: error

  coverage:
    needs: [rust, rust-sde]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r ci/requirements-coverage.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data/
      - name: Combine coverage and fail if it's <100%
        id: combinecoverage
        run: |
          set +e
          echo "## Coverage" >> $GITHUB_STEP_SUMMARY
          .venv/bin/python -u ci/merge_rust_coverage.py coverage-data/ | tee COV_REPORT
          COV_EXIT_CODE=${PIPESTATUS[0]}
          if [ $COV_EXIT_CODE -ne 0 ]; then
            echo "🚨 Coverage failed. Under 100" | tee -a $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat COV_REPORT >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $COV_EXIT_CODE
      - name: Upload HTML report
        if: ${{ failure() && steps.combinecoverage.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: _html-coverage-report
          path: htmlcov
          if-no-files-found: ignore

  # The one check to require in branch protection (and so for the merge queue),
  # so the required checks don't have to track every job and matrix entry.
  all-green:
    if: ${{ always() }}
    needs: [lean, lean-imports, vectors, rust, rust-sde, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
