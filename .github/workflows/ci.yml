name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the Mathlib build cache
        run: lake exe cache get
      - name: Check every proof (and the axiom audit)
        run: lake build
      - name: Check the generated Rust is up to date
        run: lake env lean --run Emit.lean --check

  lean-imports:
    name: Lean import discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 ci/check_lean_imports.py

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
          # 32-bit userspaces run natively on the 64-bit Linux hosts, in containers.
          - os: ubuntu-latest
            container: linux/386
          - os: ubuntu-24.04-arm
          - os: ubuntu-24.04-arm
            container: linux/arm/v7
          - os: macos-latest
          - os: windows-latest
        rust: [stable, "1.88"]
    runs-on: ${{ matrix.platform.os }}
    # With an empty image the job runs directly on the runner.
    container:
      image: ${{ matrix.platform.container && format('rust:{0}-slim', matrix.rust == 'stable' && '1' || matrix.rust) || '' }}
      options: ${{ matrix.platform.container && format('--platform {0}', matrix.platform.container) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !matrix.platform.container }}
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !matrix.platform.container }}
        with:
          repository: C2SP/wycheproof
          path: wycheproof
          persist-credentials: false
      # JavaScript actions can't run in the 32-bit containers (the runner's
      # Node is 64-bit), so check out with git there.
      - name: Checkout (container)
        if: ${{ matrix.platform.container }}
        run: |
          apt-get update -qq && apt-get install -qq -y --no-install-recommends git ca-certificates
          git config --global --add safe.directory '*'
          git init -q .
          git fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git clone -q --depth 1 https://github.com/C2SP/wycheproof wycheproof
      - name: Point the tests at the Wycheproof vectors
        shell: bash
        run: echo "WYCHEPROOF_ROOT=$PWD/wycheproof" >> "$GITHUB_ENV"

      - name: Install Rust
        if: ${{ !matrix.platform.container }}
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
          rustup default ${{ matrix.rust }}
      - name: Lint
        if: ${{ !matrix.platform.container && matrix.rust == 'stable' }}
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked
      - run: rustc -vV
      - run: cargo test --locked
