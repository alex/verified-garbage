# Where the test vectors under vectors/ come from. Each [[source]] covers
# every file in its `directories`: those files are extracted unmodified from
# the download at `url` (whose SHA-256 is `sha256`), and .gitattributes keeps
# git from touching their line endings. ci/check_vectors.py checks that every
# file under vectors/ is covered by exactly one source.

[[source]]
name = "NIST CAVP SHA byte-oriented test vectors (SHA-1, SHA-256, SHA-384, SHA-512, SHA-512/224 and SHA-512/256 .rsp files only)"
directories = ["nist-cavp/sha1", "nist-cavp/sha256", "nist-cavp/sha512"]
url = "https://csrc.nist.gov/CSRC/media/Projects/Cryptographic-Algorithm-Validation-Program/documents/shs/shabytetestvectors.zip"
sha256 = "929ef80b7b3418aca026643f6f248815913b60e01741a44bba9e118067f4c9b8"
retrieved = 2026-09-27

[[source]]
name = "RFC 8439, ChaCha20 and Poly1305 for IETF Protocols (test vectors in Appendix A)"
directories = ["rfc8439"]
url = "https://www.rfc-editor.org/rfc/rfc8439.txt"
sha256 = "25bef70fbf7a07ff45c2fe4cb7c6ce954eac687413d8610603268b4e4415324c"
retrieved = 2026-09-27

[[source]]
name = "RFC 1321, The MD5 Message-Digest Algorithm (test suite in Appendix A.5)"
directories = ["rfc1321"]
