name = "VerifiedGarbage"
# Resolve the compiled specifications before the broad library glob. Otherwise
# Lake can first assign one of these modules to VerifiedGarbage, then try to
# load NativeSpec (which includes that same module) while compiling it.
defaultTargets = ["NativeSpec", "VerifiedGarbage", "VerifiedGarbageTest"]
# Lake already checks several files concurrently. Limit each compiler to
# two threads so declaration tasks do not contend across all of those files.
moreLeanArgs = ["-j2"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true
# Mathlib's own linters (its tactic-analysis refactoring suggestions and its
# style conventions), which are on by default in every module that imports
# Mathlib, walk the syntax or info trees of every command in the interpreter:
# 5-8% of the build. The checks of Lean core stay on. `weak.` since only
# modules importing Mathlib know the options.
weak.linter.tacticAnalysis.rwaSuggestion = false
weak.linter.tacticAnalysis.introMerge = false
weak.linter.unusedTactic = false
weak.linter.globalAttributeIn = false
weak.linter.dupNamespace = false
weak.linter.style.nameCheck = false
weak.linter.auxLemma = false
weak.linter.internalConstructors = false
weak.linter.style.haveILetI = false
weak.linter.directoryDependency = false
weak.linter.overlappingInstances = false
weak.linter.style.docString.empty = false
weak.linter.adaptationNote = false
weak.linter.setNotationForOrder = false
weak.linter.fast_instance_existing = false
weak.linter.trailingWhitespace = false
weak.linter.unicodeLinter = false
weak.linter.whitespaceBeforeSemicolon = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "VerifiedGarbage"
# Build every file, not only those reachable from `Artifacts.lean`.
globs = ["VerifiedGarbage.*"]
# A module importing a module of a precompiled library below (`NativeTCB`,
# `NativeSpec`, `NativeTactics`) loads that whole library's shared library,
# and Lake would add the shared library to the module's trace: editing any
# module of the library (e.g. `TCB/AArch64/Isa.lean`) would rebuild every
# module that imports any other (every proof of every target). The shared
# library is compiled from its modules' `.olean`s, and a module runs only the
# code of what it imports, whose `.olean`s its trace already has: leave the
# shared library out of the trace (it is still loaded), so a module is
# rebuilt only when something it imports changes. (`platformIndependent` also
# leaves the platform out of the trace, and CI's cache keys have it; and
# shares outputs across platforms in Lake's artifact cache, which is off.)
platformIndependent = true

[[lean_lib]]
name = "VerifiedGarbageTest"
globs = ["VerifiedGarbageTest.+"]
# See `VerifiedGarbage`.
platformIndependent = true

# The known-answer tests (`VerifiedGarbageTest`) evaluate the specifications,
# which is an order of magnitude faster in compiled code than in the
# interpreter (ML-KEM-768: 20 s to 1 s): these modules are compiled to shared
# libraries, which the modules importing them load. It is declared last, so
# that it, and not `VerifiedGarbage`, is these modules' library.
[[lean_lib]]
name = "NativeSpec"
# Exactly these modules (as `globs`: `roots` would also take their submodules,
# such as `Spec.MlKem.Contract`, and with them the rest of the library).
roots = []
globs = ["VerifiedGarbage.Spec.Sha1", "VerifiedGarbage.Spec.Sha256",
  "VerifiedGarbage.Spec.Sha512", "VerifiedGarbage.Spec.Md5", "VerifiedGarbage.Spec.Sha3",
  "VerifiedGarbage.Spec.Hmac", "VerifiedGarbage.Spec.Pbkdf2", "VerifiedGarbage.Spec.Scrypt",
  "VerifiedGarbage.Spec.ChaCha20", "VerifiedGarbage.Spec.Poly1305", "VerifiedGarbage.Spec.Aes",
  "VerifiedGarbage.Spec.Gcm", "VerifiedGarbage.Spec.MlKem", "VerifiedGarbage.Spec.X25519",
  "VerifiedGarbage.Spec.MlDsa", "VerifiedGarbage.Spec.Ed25519", "VerifiedGarbage.Spec.Blake2",
  "VerifiedGarbage.Spec.X448", "VerifiedGarbage.Spec.Rc2", "VerifiedGarbage.Spec.Argon2"]
precompileModules = true

# The evaluator of `sig_eval` (`Proof/Framework/SigEval.lean`), a tactic run
# on every contract: compiled to a shared library like `NativeSpec`, since the
# interpreter runs it an order of magnitude slower. It imports only Lean core.
[[lean_lib]]
name = "NativeTactics"
roots = []
globs = ["VerifiedGarbage.Proof.Framework.SigEval"]
precompileModules = true

# The trusted base, which imports only Lean core: the code the emitter
# (`Emit.lean`, which loads this library) runs to check and print every
# artifact, an order of magnitude faster compiled than in the interpreter
# (52 s to 7 s). `TCB.Mem` is here and not in `NativeSpec`, which imports it.
[[lean_lib]]
name = "NativeTCB"
roots = []
globs = ["VerifiedGarbage.TCB.+"]
precompileModules = true
